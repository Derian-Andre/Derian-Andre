name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.27.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: pnpm run check

      - name: Check types
        run: pnpm run check-types

      - name: Lint source
        run: pnpm run lint

      - name: Build static site
        run: pnpm run build
        env:
          PUBLIC_SITE_URL: https://derianandre.com

      - name: Verify generated routes and assets
        run: pnpm run verify

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
