  <text transform="translate(72.86 29.75)">
    <tspan class="high black" style="font-size:35px;">LA PARADOJA DE EPICURO</tspan>
    <tspan class="muted small" x="160" y="30">derianandre.com/blog</tspan>
  </text>
  <text transform="translate(80 135)">
    <tspan class="normal black" x="7">PREMISA</tspan>
    <tspan class="high black" style="font-size:35px;" x="-72.78" y="40">EL MAL EXISTE</tspan>
    <tspan class="small muted" x="-4" y="80">O ENTONCES...</tspan>
    <tspan class="normal" x="-65" y="120">¿Dios sabe que existe?</tspan>
    <tspan class="small muted" x="51.79" y="160">SÍ</tspan>
    <tspan class="normal" x="-65" y="200">¿Puede eliminar el mal?</tspan>
    <tspan class="small muted" x="51.79" y="240">SÍ</tspan>
    <tspan class="normal" x="-25" y="280">¿Quiere hacerlo?</tspan>
    <tspan class="small muted" x="51.79" y="320">SÍ</tspan>
    <tspan class="normal" x="-79.58" y="360">¿Entonces por qué existe?</tspan>
    <tspan class="small muted" x="-10" y="400">LIBRE ALBEDRÍO</tspan>
    <tspan class="normal">
      <tspan x="-71" y="440">¿Podría crear un cosmos</tspan>
      <tspan x="-78" y="480" style="letter-spacing:-.04em">con libre albedrío y sin mal?</tspan>
    </tspan>
  </text>
  <text class="normal" transform="translate(465 175)">
    <tspan x="0" y="0">
      Dios no existe
    </tspan>
    <tspan x="0" y="80">
      No es omnisciente
    </tspan>
    <tspan x="0" y="160">
      No es omnipotente
    </tspan>
    <tspan x="0" y="240" style="font-size:16px">
      No es omnibenevolente
    </tspan>
  </text>
  <text class="muted small" transform="translate(355 255)">
